name: Pyrefly Type Check
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Run Pyrefly
        uses: facebook/pyrefly@main
        with:
          version: "1.3.1"
          python-version: "3.12"
          args: "--summarize-errors"
